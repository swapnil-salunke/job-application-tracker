name: Attach .skill to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the file to (e.g. v1.2.1)
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build .skill
        run: |
          mkdir -p /tmp/pkg/job-application-tracker
          rsync -a --exclude .git --exclude .github --exclude '__pycache__' --exclude '*.pyc' --exclude .DS_Store ./ /tmp/pkg/job-application-tracker/
          (cd /tmp/pkg && zip -rq "$GITHUB_WORKSPACE/job-application-tracker.skill" job-application-tracker)
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" job-application-tracker.skill --clobber
